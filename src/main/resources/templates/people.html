<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>People</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.2/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/general :: header}"></div>
<h1>People</h1>
<a class="btn btn-outline-primary" href="/people/new">
    <i class="bi bi-plus"></i> Add new person
</a>
<div class="main-table">
    <table class="table table-striped table-hover table-bordered table-sm">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>name</th>
            <th>age</th>
            <th>meetings</th>
            <th>actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="person : ${people}">
            <td th:text="${person.id}"></td>
            <td th:text="${person.name}"></td>
            <td th:text="${person.age}"></td>
            <td>
                <a class="btn btn-outline-primary btn-sm" th:href="@{/person/{id}/meetings(id=${person.id})}">meetings</a>
            </td>
            <td>
                <a class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#myconfirm"
                   th:attr="data-bs-link=@{/people/delete/{id}(id=${person.id})}, data-bs-text=${person.name}, data-bs-id=${person.id}" >
                    <i class="bi bi-trash"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/general :: confirm}"></div>
<script th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
